[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-reasoning"
version = "1.1"
description = "Graph reasoning with large language models via pseudo-code prompting"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Konstantinos Skianis" },
    { name = "Giannis Nikolentzos" },
    { name = "Michalis Vazirgiannis" },
]
dependencies = [
    "networkx",
    "numpy",
    "scipy",
    "openai",
    "pydantic>=2",
    "tenacity",
    "tqdm",
]

[project.optional-dependencies]
# Only needed for scripts/visualize_graph.py
viz = ["matplotlib"]

[tool.setuptools]
# Only the pipeline is a package; data/, results/, scripts/ and legacy/ stay as repo folders.
packages = ["graph_reasoning"]
