[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-reasoning"
version = "1.1"
description = "Graph reasoning with large language models via pseudo-code prompting"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Konstantinos Skianis" },
    { name = "Giannis Nikolentzos" },
    { name = "Michalis Vazirgiannis" },
]
dependencies = [
    "networkx",
    "numpy",
    "scipy",
    "openai",
    "pydantic>=2",
    "tenacity",
    "tqdm",
    "litellm>=1.104.0",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
# Only needed for scripts/visualize_graph.py
viz = ["matplotlib"]

[tool.setuptools]
# Packages: the old pipeline and the new harness; data/, results/, scripts/ and legacy/ stay as repo folders.
packages = ["graph_reasoning", "harness", "eval"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
